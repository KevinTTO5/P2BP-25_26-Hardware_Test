name: release

# Builds the mv3dt-installer binary and publishes it as a GitHub Release
# asset. This is the ONLY way an operator gets the installer: a bare Ubuntu
# 24.04 workstation downloads one file from the Releases page and runs it,
# and never clones this repo (doc 00 section 4.1, section 5).
#
# Triggers:
#   push of a `v*` tag
#       builds and publishes the release.
#   pull_request touching installer/
#       builds only, so every PR that could break the frozen build proves
#       the frozen build before it is merged.
#   workflow_dispatch
#       manual run; `draft: true` publishes a draft release (a real but
#       invisible, deletable release object) so the publish path can be
#       rehearsed before the first real tag.
#
# No step in this workflow writes a tracked file. The version lives in
# mv3dt_installer/__init__.py and is bumped by an ordinary source commit;
# the tag is only what triggers publication, and the build refuses to
# continue if the two disagree.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish a draft release from the selected ref (select a tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # PINNED, deliberately never ubuntu-latest. PyInstaller's --onefile
    # bootloader is linked against the build host's glibc, so the binary
    # only starts on a target whose glibc is at least as new. Ubuntu 24.04
    # is the install target (doc 00 section 2), and ubuntu-latest floats:
    # the day GitHub repoints it at a newer image, this workflow would keep
    # going green while publishing a binary that dies on the target with a
    # "GLIBC_2.xx not found" message nobody would connect back to a runner
    # label. Bump this line only together with the supported target OS.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is what Ubuntu 24.04 ships, so the frozen interpreter
          # matches the target's own Python.
          python-version: "3.12"

      - name: Install PyInstaller and the installer package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e installer

      - name: Verify the tag matches __version__
        # Tag pushes only: a pull_request ref has no version to agree with.
        # A mismatch fails the build here rather than shipping a binary
        # whose --version contradicts the release it hangs under.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys

          from mv3dt_installer import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              sys.exit(
                  f"tag/version mismatch: pushed tag {tag!r}, but "
                  f"mv3dt_installer.__version__ is {__version__!r} "
                  f"(expected tag {expected!r}). Bump __version__ in "
                  "installer/mv3dt_installer/__init__.py, or retag."
              )
          print(f"tag {tag} matches __version__ {__version__}")
          PY

      - name: Stamp the build
        # Untracked file, ignored via installer/.gitignore. Written before
        # PyInstaller runs so the stamp is baked into the binary through the
        # normal import graph; installer.spec needs no entry for it.
        env:
          # Empty on pull_request and on a branch dispatch, which is what
          # tells __init__.py this is not a released build.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib

          tag = os.environ["TAG"]
          commit = os.environ["COMMIT"][:7]
          built = datetime.datetime.now(datetime.timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )
          target = pathlib.Path("installer/mv3dt_installer/_buildinfo.py")
          target.write_text(
              '"""Generated by .github/workflows/release.yml. Untracked.\n\n'
              "Read through mv3dt_installer.build_info(); a source checkout\n"
              'has no such file and falls back to placeholder values.\n"""\n\n'
              f'TAG = "{tag}"\n'
              f'COMMIT = "{commit}"\n'
              f'BUILT_UTC = "{built}"\n',
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY

      - name: Build the binary
        run: |
          pyinstaller installer/installer.spec \
            --distpath dist \
            --workpath /tmp/mv3dt-build \
            --clean \
            --noconfirm

      - name: Smoke test the binary
        # Runs as the unprivileged runner user on purpose. --status is the
        # right probe precisely because app.main() handles it BEFORE
        # privilege.require_root() (see app.main()'s docstring): it
        # exercises argparse, state.py's forgiving reader on a machine with
        # no state.json at all, and the sys._MEIPASS unpack, without needing
        # root, apt, or a GPU.
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "smoke test must not run as root" >&2
            exit 1
          fi
          chmod +x dist/mv3dt-installer
          version="$(python -c 'import mv3dt_installer; print(mv3dt_installer.__version__)')"
          # Captured rather than piped into grep: `grep -q` closes the pipe
          # on its first match, and under `pipefail` the resulting SIGPIPE
          # would fail this step at random.
          banner="$(dist/mv3dt-installer --version)"
          echo "$banner"
          case "$banner" in
            *"$version"*) ;;
            *)
              echo "--version banner does not name version $version" >&2
              exit 1
              ;;
          esac
          dist/mv3dt-installer --status

      - name: Checksum the binary
        working-directory: dist
        # Bare filename in the .sha256 so an operator can run
        # `sha256sum -c mv3dt-installer.sha256` next to the download.
        run: sha256sum mv3dt-installer > mv3dt-installer.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mv3dt-installer
          path: |
            dist/mv3dt-installer
            dist/mv3dt-installer.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Tag pushes publish; a manual dispatch publishes only when explicitly
    # asked for a draft, and only from a tag ref (a draft dispatch from a
    # branch has no tag for --verify-tag to check, so it is excluded here
    # rather than left to fail late inside the run: step). Pull requests
    # never reach this job. A non-draft workflow_dispatch never publishes,
    # even against an existing tag: only the push:tags trigger publishes
    # a real release.
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.draft))
    # Same pin as the build job; see the comment there.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mv3dt-installer
          path: dist

      - name: Create the GitHub Release
        # `gh` is preinstalled on the runner. No third-party action is used
        # here on purpose: this is the one workflow that publishes an
        # executable, so its supply chain stays as short as it can be.
        #
        # --verify-tag refuses to invent a tag that does not exist, which
        # also means a draft dispatch must be launched from a tag ref rather
        # than a branch.
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --verify-tag)
          if [ "${DRAFT:-}" = "true" ]; then
            flags+=(--draft)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            dist/mv3dt-installer dist/mv3dt-installer.sha256
